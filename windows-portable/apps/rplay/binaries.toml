# The third-party programs the release carries beside the app's own, each pinned to one tested download and checked
# against its SHA-256 (windows-portable/tools/build_release.py: they go beside the program's modules, in _internal,
# and their licenses into THIRD-PARTY-NOTICES.txt). From a checkout,
#   python windows-portable/tools/build_release.py --binaries rplay
# fetches them to %LOCALAPPDATA%\windows-portable-suite\build\windows-portable-rplay\, where the app looks then.
#
# Fields: name (the notice's title), url, sha256 (of the download), file (the member of the zip to take) and
# license (the member with its license text).

[[binary]]
name = "SDL 3.4.18 (Zlib)"              # the controllers in the stream (gamepad.py), as Console Link reads them
url = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18-win32-x64.zip"
sha256 = "75c2c0fc74e7d1206aaedc22893a35887332f4f85f5c8b74fddc10d177985f2c"
file = "SDL3.dll"
license = "LICENSE.txt"
