# Builds the Python module remote_play_core: maturin build --release (a wheel for Python 3.10 and newer), or
# maturin develop to install it into the current venv for the tests. From PowerShell, with MSYS2's MINGW64 GCC on
# PATH (C:\msys64\mingw64\bin) and Rust's stable-x86_64-pc-windows-gnu toolchain: see the README.
[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "windows-portable-rplay-core"
version = "1.0.0"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }

[tool.maturin]
features = ["python", "pyo3/extension-module"]
