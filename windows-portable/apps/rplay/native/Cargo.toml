# SPDX-License-Identifier: AGPL-3.0-or-later
# The native core of Remote Play: Console Link's stream layer (Takion and its crypto) in Rust, for Python through
# PyO3, built for Windows with Rust's x86_64-pc-windows-gnu toolchain and MSYS2's MINGW64 GCC (ffmpeg/build.sh).
# The protocol code builds and tests without Python (cargo test); maturin builds the Python module with the
# "python" feature (pyproject.toml).
[package]
name = "windows-portable-rplay-core"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "remote_play_core"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]
# The video decoder: FFmpeg from ffmpeg/build.sh, linked statically (build.rs).
decoder = ["dep:cc"]

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# generate-import-lib: python3.dll's import library made with MinGW's dlltool, as the GNU toolchain has none.
pyo3 = { version = "0.29", features = ["abi3-py310", "generate-import-lib"], optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
