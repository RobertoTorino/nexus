{#- The Nexus page's header: the icon on the left (it carries the name, so no tooltip repeats it, owner 28-10-2026),
    Design, GitHub and the suites on the right. -#}
<header class="md-header md-header--shadow" data-md-component="header">
  <nav class="md-header__inner md-grid" aria-label="{{ lang.t('header') }}">
    <a href="{{ nav.homepage.url | url }}" class="md-header__button md-logo" aria-label="{{ config.site_name }}" data-md-component="logo">
      {% include "partials/logo.html" %}
    </a>
    <div class="md-header__spacer"></div>
    <div class="md-header__links">
      <a class="md-header__link" href="{{ 'design/' | url }}">Design</a>
      <a class="md-header__link" href="{{ config.repo_url }}">GitHub</a>
      <a class="md-header__link" href="{{ '.' | url }}#the-suites">Suites</a>
    </div>
  </nav>
</header>
