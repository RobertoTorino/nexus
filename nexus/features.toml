[[family]]
name = "Memory Manager"
apps = { bc250-bazzite = "vram" }
features = [
  { text = "Overview: VRAM split, GTT, TTM limit, RAM and swap" },
  { text = "Memory map: live bar of the 16 GB, preview next boot" },
  { text = "Split: set the VRAM split in CMOS, undo" },
  { text = "GTT limit: set ttm.pages_limit on the kernel line" },
  { text = "Profiles: Default or Games split and limit at once" },
  { text = "Read CMOS: show and save the memory block, read-only" },
  { text = "Safety: refuses on bad checksum, lockdown, other boards" },
  { text = "Backups: CMOS block before and after every change" },
]

[[family]]
name = "Fan Control"
apps = { bc250-bazzite = "fan" }
features = [
  { text = "Overview: GPU and CPU temperature, fans, guard state" },
  { text = "Fans: every fan, its header, firmware curve or manual" },
  { text = "Guard: warn, full fans, clean shutdown at set limits" },
  { text = "Guard: runs as a service, also with no app open" },
  { text = "Guard: reports a stopped fan, ignores broken sensors" },
  { text = "Limits: set, apply, back to defaults" },
  { text = "History: what the guard did, newest first" },
]

[[family]]
name = "USB Wi-Fi"
apps = { bc250-bazzite = "wdriver" }
features = [
  { text = "Status: stick mode, chip, driver and Wi-Fi interface" },
  { text = "Driver: branch chosen from the chip's revision" },
  { text = "Build: AIC8800D80 driver for the running kernel" },
  { text = "Build: newest sources when a kernel breaks the pin" },
  { text = "Install: service loads it at every boot, rebuilds" },
  { text = "Install: switches a stick out of storage mode" },
  { text = "Driver: update and remove" },
  { text = "Wi-Fi adapters: check any stick's kernel support" },
]

[[family]]
name = "BC-250 CEC Manager"
apps = { bc250-bazzite = "cec" }
features = [
  { text = "TV: turn on, standby, switch to the board's input" },
  { text = "TV: volume and mute, to the TV or an AV receiver" },
  { text = "TV: check, list devices on the bus, TV info" },
  { text = "Name: set the name the TV shows for the board" },
  { text = "Picture: fix a black TV after standby" },
  { text = "Media: pause players while the TV is off" },
  { text = "Boot: name the board, turn the TV on before login" },
  { text = "Daemon: wake and sleep with the TV, remote as keys" },
  { text = "Remote: map buttons to keys, show received keys" },
]

[[family]]
name = "Bluetooth Pairing"
apps = { bc250-bazzite = "btpair" }
features = [
  { text = "Pairing: the listed keyboard, mouse and controllers paired after every boot, on the login screen" },
  { text = "Pairing: a device that dropped its pairing paired again; other names never" },
  { text = "Batteries: PlayStation controller batteries in the Bluetooth icon" },
  { text = "Login: Bluetooth switched on at every login (Plasma)" },
]
