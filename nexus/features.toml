# SPDX-License-Identifier: GPL-3.0-or-later
# The apps and their features across the suites: the source of the Nexus page's Apps and features chapter
# (nexus/docs/features.md), which tools/features.py writes from it. Run that tool after every change here;
# tools/tests/test_features.py fails while the chapter is not current, an app of a suite's portal/apps.toml is in no
# family, or a family names an app that is not there.
#
# [suites.<folder>]   a column: the suite's name, the short name over its column, its wiki's address
# [[family]]          one app across the suites, in the portals' category order (the portal first)
#   name              the row's name
#   apps              suite folder -> the app's folder in it ("portal" for the suite's portal)
#   features          a few words each, "<Area>: <what it does>", for the person using the app; no status or plans.
#                     `in` lists the suites that have it; without `in`, every suite of the family has it.
#                     Write a feature the suites share in the same words, so it is one row.

[suites.bc250-bazzite]
name = "BC250 Bazzite Suite"
short = "BC250"
wiki = "https://robertotorino.github.io/nexus/bc250-bazzite-suite/"

[suites.windows-portable]
name = "Windows Portable Suite"
short = "Portable"
wiki = "https://robertotorino.github.io/nexus/windows-portable-suite/"

[[family]]
name = "Portal"
apps = { bc250-bazzite = "portal", windows-portable = "portal" }
