# SPDX-License-Identifier: GPL-3.0-or-later

site_name: BC250 Bazzite Suite
site_description: Tools for the AMD BC-250 running Bazzite
site_url: https://robertotorino.github.io/nexus/bc250-bazzite-suite/
repo_url: https://github.com/RobertoTorino/nexus
repo_name: RobertoTorino/nexus
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
plugins:
  - search
  - privacy                    # fonts and other external assets downloaded at build time and served from the
                               # wiki itself, so a visit sends nothing to Google Fonts
hooks:
  - tools/mkdocs/hooks.py
  - ../tools/mkdocs/design_panel.py   # a design panel on every page, only while `mkdocs serve` runs (the Nexus tools)
theme:
  name: material
  custom_dir: tools/mkdocs/overrides
  logo: images/wiki-icon.webp
  favicon: images/wiki-icon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:                     # dark only, without a switch
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tooltips         # a title shows as a rounded tooltip of the site's design, not the browser's
extra_css:
  - stylesheets/suite.css
extra:
  generator: false             # no "Made with Material for MkDocs" in the footer
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}   # GitHub's anchors
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Install: install.md
  - Portal: portal.md
  - Portal Tour: portal-tour.md
  - Apps:
      - apps/index.md
      - App categories: apps/categories.md
      - Covers from SteamGridDB: apps/covers.md
      - BC-250 Bazzite Test: apps/check.md
      - BC-250 GPU Governor Manager: apps/gpu.md
      - BC-250 Upscaler Manager: apps/upscaler.md
      - BC-250 CU Bisect: apps/compute.md
      - BC-250 Cores Bisect: apps/cores.md
      - BC-250 GPU OC Bisect: apps/oc.md
      - BC-250 Persistent ACPI: apps/acpi.md
      - System Overlay: apps/overlay.md
      - USB IPS3.5: apps/ips35.md
      - USB HD Cam: apps/hdcam.md
      - USB HD Control: apps/hdcontrol.md
      - BC-250 BIOS Reader: apps/bios.md
      - BC-250 Memory Manager: apps/vram.md
      - BC-250 Fan Control: apps/fan.md
      - BC-250 USB Wi-Fi: apps/wdriver.md
      - BC-250 ACE Queues: apps/ace.md
      - BC-250 Mesh Shaders: apps/mesh.md
      - HDMI CEC Manager: apps/cec.md
      - Bazzite SFTP Tools: apps/sftp.md
      - Dependency Checker: apps/package.md
      - Bazzite NetcatGUI: apps/ncgui.md
      - Console Link: apps/consoles.md
      - Console LinkB: apps/clb.md
      - shadPS4 Manager: apps/shadps4.md
      - RPCS3 Manager: apps/rpcs3.md
      - PPSSPP Manager: apps/ppsspp.md
      - PCSX2 Manager: apps/pcsx2.md
      - Vita3K Manager: apps/vita3k.md
      - Xenia Manager: apps/xenia.md
      - Decky Loader Manager: apps/decky.md
      - Bazzite DatStation: apps/datstation.md
  - Development:
      - development/index.md
      - Architecture and consistency: development/architecture.md
      - Bazzite Test script: development/bazzite-test.md
      - Bazzite Test internals: development/bazzite-test-internals.md
      - Bazzite Test test plan: development/bazzite-test-plan.md
      - Memory Manager internals: development/memory-manager.md
      - "Console Link: the stream's threads": development/console-link-stream.md
  - Security:
      - Security policy: SECURITY.md
      - Privacy: privacy.md
  - History:
      - What is Bazzite: history/bazzite.md
      - What is BC-250: history/bc250.md
  - Other tools:
      - Media tool: other-tools/media-tool.md
validation:
  links:
    anchors: warn
