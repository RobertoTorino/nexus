# SPDX-License-Identifier: AGPL-3.0-or-later
# The native core of Console Link: the stream layer (Takion and its crypto) in Rust, for Python through PyO3.
# The protocol code builds and tests without Python (cargo test); maturin builds the Python module with the
# "python" feature (pyproject.toml).
[package]
name = "bc250-console-link-core"
version = "1.17.2"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "bc250_console_link_core"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]
# The video decoder: FFmpeg from ffmpeg/build.sh, linked statically (build.rs).
decoder = ["dep:cc"]

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
