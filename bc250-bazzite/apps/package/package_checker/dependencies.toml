[[tool]]
name = "FUSE 2"
description = "The FUSE 2 library (libfuse.so.2), with which an AppImage mounts itself. Checked by its library file."
executables = []
locations = ["/usr/lib64/libfuse.so.2", "/usr/lib/x86_64-linux-gnu/libfuse.so.2", "/usr/lib/libfuse.so.2"]
probe = "path"

[[tool.source]]
owner = "shadps4"
need = "optional"
usage = "shadPS4 is an AppImage; without the library it unpacks itself to a temporary folder on every start, which is slower."
