[[tool]]
name = "flashrom"
description = "Reads and writes flash chips. BIOS Reader uses it only to read the BIOS chip on the board, through the chipset's internal programmer; a flashrom built without that programmer cannot read it."
executables = ["flashrom"]
locations = ["~/flashrom/usr/bin/flashrom", "/usr/sbin/flashrom", "/usr/bin/flashrom"]
probe = "flashrom-internal"
root = true

[[tool.source]]
owner = "bios"
need = "optional"
usage = "Read the BIOS flash chip; needs the internal programmer."
anchor = "reading-the-bios-flash-chip-optional"

[[tool]]
name = "bluetoothctl"
description = "BlueZ's command line for Bluetooth. USB HD Control uses it only to end a controller's Bluetooth connection: so that Linux takes its USB cable instead, or to switch it off."
executables = ["bluetoothctl"]

[[tool.source]]
owner = "hdcontrol"
need = "optional"
usage = "Use the cable disconnects a controller that stayed on Bluetooth while plugged in; Turn Bluetooth off and the idle service switch a controller off."
anchor = "on-the-cable-and-over-bluetooth"

[[tool]]
