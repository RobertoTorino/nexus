# SPDX-License-Identifier: GPL-3.0-or-later
# Runtime dependencies only. Keep this catalog in sync with the apps', core's and portal's requirements.
# Only what the portal and its apps use: a Bazzite system package is listed when one of our apps runs it, never
# for Bazzite's own sake (tests/test_dependencies.py checks every tool against the apps that name it).
#
# [app.<owner>]  name, and the launchers the app's installer writes (portal/apps.toml: detect). The python on a
#                launcher's exec line is the app's Python environment; no launcher means the app is not installed.
#                core has none: it is bundled with each app and runs in that app's environment.
# [[tool]]       name, description (shown when the name is clicked), executables (any one of them will do) and/or
#                locations, probe ("path": a library file; "flashrom-internal"; "console-link-ffmpeg": the FFmpeg
#                in Console Link's native core, asked through the app's python), root (true: it does its work only as root, through sudo or pkexec), and per app
#                a [[tool.source]] with need ("required" or "optional"), usage and an optional manual anchor.
# [[dependency]] a Python package: name, description, and per app a [[dependency.source]] with its specifier.

