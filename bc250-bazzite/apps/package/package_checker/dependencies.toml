[[dependency]]
name = "pygame-ce"
description = "A community-maintained game library for Python, built on SDL. The portal reads a game controller with it (the pad's buttons under SDL's common names), to move around Suite Big Picture Mode, and Console LinkB reads the controller of a stream with it and sends it the stream's rumble; neither opens a window or plays sound with it."

[[dependency.source]]
owner = "portal"
specifier = ">=2.5,<3"

[[dependency.source]]
owner = "clb"
specifier = ">=2.5,<3"

[[dependency]]
name = "PyQt6-Charts"
description = "Qt's chart module for PyQt6. Bazzite Test draws its benchmark and history graphs with it, the Governor Manager its clock, load and temperature graphs."

[[dependency.source]]
owner = "check"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "gpu"
specifier = ">=6.11,<7"

[[tool]]
name = "gcc"
description = "The C compiler. BC-250 USB Wi-Fi builds the Wi-Fi driver with it against the running kernel; Bazzite's image ships it with the kernel's build tree (kernel-devel)."
executables = ["gcc"]

[[tool.source]]
owner = "wdriver"
need = "required"
usage = "Build the Wi-Fi driver for the running kernel, in the app and in its service after a kernel update."

[[tool]]
name = "make"
description = "Runs the kernel's build system for an out-of-tree module."
executables = ["make"]

[[tool.source]]
owner = "wdriver"
need = "required"
usage = "Build the Wi-Fi driver with the kernel's build tree."

[[tool]]
name = "git"
description = "Fetches the driver's sources at the pinned commit."
executables = ["git"]

[[tool.source]]
owner = "wdriver"
need = "required"
usage = "Fetch the Wi-Fi driver's sources, one commit, the first time a branch is built."

[[tool]]
name = "kmod"
description = "Loads and unloads kernel modules (insmod, modprobe, rmmod)."
executables = ["insmod", "modprobe", "rmmod"]

[[tool.source]]
owner = "wdriver"
need = "required"
usage = "The driver's service loads the Wi-Fi driver's two modules at boot and unloads them when stopped."

[[tool]]
name = "eject"
description = "Ejects a removable disk. An AIC8800 stick leaves its storage mode when its virtual disk is ejected."
executables = ["eject"]

[[tool.source]]
owner = "wdriver"
need = "required"
usage = "Switch the stick out of storage mode, from the udev rule and from the driver's service."

[[tool]]
name = "udevadm"
description = "Controls udev: reloads its rules after a change."
executables = ["udevadm"]

[[tool.source]]
owner = "wdriver"
need = "required"
usage = "Reload udev's rules after installing or removing the stick's rule."

[[tool.source]]
owner = "ips35"
need = "required"
usage = "Applies the rule that gives your user the screen's port, at once, without unplugging it."
anchor = "access-to-the-screen"

[[tool.source]]
owner = "hdcam"
need = "required"
usage = "Applies the rule that gives your user the camera's boot loader, at once, without unplugging it."
anchor = "access-to-the-camera"

[[dependency]]
name = "obsws-python"
description = "A client for OBS Studio's WebSocket interface. Media Tool starts and stops OBS recordings with it."

[[dependency.source]]
owner = "mtool"
specifier = ">=1.8,<2"

[[dependency]]
name = "dbus-next"
description = "A pure-Python D-Bus library. Media Tool uses it for the desktop's global shortcut portal, so its recording shortcut works while another window has the focus."

[[dependency.source]]
owner = "mtool"
specifier = ">=0.2.3,<1"

[[dependency]]
name = "pillow"
description = "An imaging library for Python. Media Tool converts the suite's category icons with it (WebP and PNG, scaled to each size)."

[[dependency.source]]
owner = "mtool"
specifier = ">=12,<13"

[[dependency]]
name = "paramiko"
description = "An SSH and SFTP library for Python. Bazzite SFTP Tools connects to the host, transfers files and runs the sshd commands of the Server Manager with it."

[[dependency.source]]
owner = "sftp"
specifier = ">=3.4,<5"

[[dependency]]
name = "cryptography"
description = "Cryptographic recipes and primitives for Python, on OpenSSL. Console Link encrypts registration and the control connection of a Remote Play session with its AES and HMAC; the shadPS4 Manager's Extract PKG decrypts packages with its AES-CBC and AES-XTS."

[[dependency.source]]
owner = "consoles"
specifier = ">=42,<51"

[[dependency.source]]
owner = "shadps4"
specifier = ">=42,<51"

[[dependency]]
name = "aiortc"
description = "WebRTC for Python, on asyncio. Console LinkB's streams from an Xbox or Xbox Cloud Gaming run on it: the connection, the H.264 video and Opus sound (decoded with PyAV, whose wheels include FFmpeg, which aiortc installs with it) and the data channels for the controller."

[[dependency.source]]
owner = "clb"
specifier = ">=1.14,<2"
