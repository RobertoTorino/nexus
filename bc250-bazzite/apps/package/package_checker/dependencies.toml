description = "Plays a sound file through PulseAudio or PipeWire. SFTP Tools plays the desktop's \"complete\" sound with it when a transfer is done."
executables = ["paplay"]

[[tool.source]]
owner = "sftp"
need = "optional"
usage = "The sound when a transfer completes; without it the app uses Qt's beep."
anchor = "what-it-needs"

[[tool]]
name = "SDL3"
description = "The Simple DirectMedia Layer library (libSDL3): reads game controllers, with one button layout for every kind. Checked by its library file."
executables = []
locations = ["/usr/lib64/libSDL3.so.0", "/usr/lib/x86_64-linux-gnu/libSDL3.so.0", "/usr/lib/libSDL3.so.0"]
probe = "path"

[[tool.source]]
owner = "consoles"
need = "optional"
usage = "Reads the controllers on the board for the stream; without it the console sees a controller lying still."
anchor = "what-you-need"

[[tool]]
name = "FFmpeg"
description = "The audio and video codec library. Console Link carries its own inside the app's native core (decoders only, LGPL, built from pinned sources), so nothing is installed on the system for it; checked by asking the installed core which version it holds."
executables = []
locations = ["~/.local/share/bc250-console-link/venv/bin/python"]
probe = "console-link-ffmpeg"

[[tool.source]]
owner = "consoles"
need = "required"
usage = "Decodes the stream's picture (H.264) and sound (Opus); without it there is no stream. It comes with the app: install the app again through the portal when it is missing."
anchor = "install-and-remove"

[[tool]]
name = "libva"
description = "The VA-API library, the way to a GPU's video decoder. Part of Bazzite. Checked by its library files."
executables = []
locations = ["/usr/lib64/libva.so.2", "/usr/lib/x86_64-linux-gnu/libva.so.2", "/usr/lib/libva.so.2"]
probe = "path"

[[tool.source]]
owner = "consoles"
need = "required"
usage = "The native core links it (with libva-drm) to use a GPU's video decoder where there is one; the BC-250 has none and decodes in software, but the core does not load without the library."
anchor = "install-and-remove"

[[tool]]
name = "Steam"
description = "Valve's game client. Bazzite starts it with bazzite-steam."
executables = ["steam", "bazzite-steam"]

[[tool.source]]
owner = "consoles"
need = "optional"
usage = "Add to Game Mode (a Steam shortcut per console) and the PS button setting close Steam with steam -shutdown and start it again with bazzite-steam."
anchor = "using-it"

[[tool.source]]
