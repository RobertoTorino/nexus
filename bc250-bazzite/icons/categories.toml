# The category of each app's icon. Every app in a category has the same icon, kept once in icons/<category>/:
# <category>-1024.webp, -512.webp, -256.webp and -128.png. tools/sync_icons.py copies them to where the apps, the
# installers, the portal and the wiki look for them; tools/tests/test_icons.py fails when a copy is out of date.
#
#   [<key>]       the portal's key (apps.toml), or the app's folder for one the portal does not list
#   category      a folder of icons/
#   icons         the app's icons, without extension: <icon>.webp gets the 512 px one, <icon>-128.png the 128 px one
#   tile          optional: the portal's tile, portal/images/apps/<key>.webp, gets the 256 px one
#
# Each category's 512 px icon is also copied to portal/images/categories/<category>.webp, for Suite Big Picture Mode.
#
# To replace a category's icons, drop the new images in icons/<category>/ and run python3 tools/sync_icons.py: one
# named <category>-<size>.<any extension> becomes that size, one by another name all four. It converts them (scaled,
# WebP, the 128 px one PNG, under the names above), removes the dropped files and writes the copies. Media Tool's
# Convert icons… does the same from a window.

