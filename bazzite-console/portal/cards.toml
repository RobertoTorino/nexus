[cards.youtube]
name = "YouTube"
summary = "Open regular YouTube fullscreen in Brave Browser. Brave Browser must be installed as a Flatpak."
category = "media"
icon = "youtube.webp"
flatpak_id = "com.brave.Browser"
flatpak_name = "Brave Browser"
launch = ["flatpak", "run", "com.brave.Browser", "--kiosk", "https://www.youtube.com/"]

