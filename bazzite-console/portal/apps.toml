# Each [apps.<name>] table pins one release of a suite app. The required app is always installed and listed first.

[apps.bazzite]
name = "Bazzite Test"
summary = "Read-only system details for PlayStation 5 hardware running Bazzite."
tag = "ps5-bazzite-v0.2.0"
sha256 = ""
required = true
changes_board = false
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bazzite-test"]
launch = [["Open", "~/.local/bin/bazzite-test"]]

