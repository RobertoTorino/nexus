[apps.decky]
name = "Decky Loader Manager"
summary = "Manage Decky Loader and Steam Game Mode plugins; installation adds a system service."
tag = "ps5-decky-v0.2.0"
sha256 = ""
required = false
changes_board = true
board_change = "Installs Decky Loader under the user's homebrew folder, adds and enables a root systemd service, and labels the loader binary for SELinux. The Decky install and service are system-wide, not isolated to this manager. It does not change firmware or boot settings. Uninstalling Decky Loader Manager leaves Decky Loader and its service in place; remove Decky with `ujust setup-decky uninstall`. Use only on a Bazzite image with Steam/Game Mode and systemd support."
category = "gaming"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/ps5-decky-manager"]
launch = [["Open", "~/.local/bin/ps5-decky-manager"]]

