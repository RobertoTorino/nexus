# SPDX-License-Identifier: GPL-3.0-or-later

site_name: Bazzite Console Suite
site_description: Tools for PlayStation 5 hardware running Bazzite
site_url: https://robertotorino.github.io/nexus/bazzite-console-suite/
repo_url: https://github.com/RobertoTorino/nexus
repo_name: RobertoTorino/nexus
edit_uri: edit/main/bazzite-console/docs/
docs_dir: docs
strict: true
plugins:
  - search
  - privacy
hooks:
  - tools/mkdocs/hooks.py
  - ../tools/mkdocs/design_panel.py
  - ../tools/mkdocs/disclaimer.py
theme:
  name: material
  custom_dir: tools/mkdocs/overrides
  logo: images/wiki-icon.webp
  favicon: images/wiki-icon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tooltips
extra_css:
  - stylesheets/suite.css
extra:
  generator: false
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Install: install.md
  - Portal: portal.md
  - Apps:
      - apps/index.md
      - App categories: apps/categories.md
      - Bazzite Test: apps/bazzite.md
      - RPCS3 Manager: apps/rpcs3.md
      - Console Link: apps/consoles.md
      - Console LinkB: apps/clb.md
      - shadPS4 Manager: apps/shadps4.md
      - Decky Loader Manager: apps/decky.md
      - Bazzite DatStation: apps/datstation.md
      - PPSSPP Manager: apps/ppsspp.md
      - PCSX2 Manager: apps/pcsx2.md
      - Vita3K Manager: apps/vita3k.md
      - Xenia Manager: apps/xenia.md
      - SFTP Tools: apps/sftp.md
      - USB HD Cam: apps/hdcam.md
      - USB HD Control: apps/hdcontrol.md
      - SSD Check: apps/ssd.md
      - Media: apps/media.md
  - Development:
      - development/index.md
  - Security:
      - Security policy: SECURITY.md
      - Privacy: privacy.md
validation:
  links:
    anchors: warn
