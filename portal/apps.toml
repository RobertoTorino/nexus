[apps.vram]
name = "BC-250 Memory Manager"
summary = "The VRAM split in CMOS, with the GTT, TTM limit and swap layout that go with it."
tag = "vram-v1.1.1"
sha256 = "c39c18cc6bc00e4d9a8c1f39f82de1ca2b37f8934cfe04bafdadb259ee44add1"
required = false
changes_board = true
board_change = """
The app writes the VRAM split into the board's CMOS: the firmware's own memory block of 28 bytes in bank 2, with
its checksum, and never a byte outside it. The firmware reads the split at the next boot. CMOS is kept by the
board's battery, so the split stays across reboots and power offs until it is written again or the CMOS is
cleared with the jumper or the battery, which brings the firmware's 512 MB back. The GTT limit is a kernel
argument, set with rpm-ostree kargs in the next deployment. Nothing is written to the BIOS itself, the firmware
or the real-time clock, and the app refuses to write when the block's signature or checksum does not match or
the kernel is locked down. Undo writes the previous split back, and the Default profile writes 512 MB and
removes the kernel argument; both take effect after a reboot.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-memory-manager"]
launch = [["Open", "~/.local/bin/bc250-memory-manager"]]

[apps.fan]
name = "BC-250 Fan Control"
summary = "A thermal guard that warns, cools and shuts down cleanly at a critical temperature, and the fans."
tag = "fan-v1.1.1"
sha256 = "3b8b43d5709bba3da53bee26a4c5576474fdb1b823716edd1ac85d832be54a23"
required = false
changes_board = true
board_change = """
The thermal guard is a root system service, bc250-fan-control-guard.service with its files in
/etc/bc250-fan-control, that reads the temperatures every two seconds. At the cool limit it sets every fan to
full speed in sysfs and switches the GPU governor's performance mode off; at the shutdown limit, held for the
set number of seconds, it powers the board off cleanly with systemctl poweroff. The service stays enabled across
reboots and power offs. The fan settings are written in memory only, and the guard puts the saved values back
when it re-arms or stops. Nothing is written to the BIOS, the firmware, the CMOS or the kernel's arguments. Turn
off disables the service and removes its files; the fans are back on their previous setting, and performance
mode, once the guard switched it off, stays off until you switch it on again.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-fan-control"]
launch = [["Open", "~/.local/bin/bc250-fan-control"]]

[apps.wdriver]
name = "BC-250 USB Wi-Fi"
summary = "The driver for AIC8800D80 USB Wi-Fi sticks: built for the running kernel, loaded at boot, rebuilt after a kernel update."
tag = "wdriver-v1.1.2"
sha256 = "c295751343bca6758fcdc76b218033f7d34e95495b27dfe758170548de8934de"
required = false
changes_board = true
board_change = """
The app builds the AIC8800D80 driver as your user against the running kernel's headers and installs it as root
under /var/lib/bc250-usb-wifi, with a system service, bc250-usb-wifi.service, that loads the two modules with
insmod at every boot, and a udev rule that switches a stick out of its storage mode. Nothing goes into /usr, and
no kernel argument, BIOS, firmware or CMOS setting changes; the firmware files it carries are uploaded to the
stick, never to the board. The files stay across reboots, power offs and kernel updates: after a kernel update
the service builds the driver again at boot. Remove unloads the modules, disables the service and deletes every
file under /etc and /var/lib; the board is as before, and the build in your home folder stays until the app's
uninstall.
"""
category = "utilities"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-usb-wifi"]
launch = [["Open", "~/.local/bin/bc250-usb-wifi"]]

