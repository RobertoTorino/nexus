[apps.compute]
name = "BC-250 CU Bisect"
summary = "Tell bad CUs apart from an unstable CU unlock, and apply a tested unlock."
tag = "compute-v0.4.2"
sha256 = "8c55dc18478f3cd04ea48201c09bcdde4f1902cd886ba5453da80bd9cca9ed3b"
required = false
changes_board = true
board_change = """
The app writes the GPU's shader array and WGP mask registers with umr, as root, while the driver runs: that is
the CU unlock. The registers are volatile: any reboot puts the stock 24 CUs back, and nothing is burned into the
chip. The unlock stays across reboots and power offs only through the root service that CU Unlock installs,
bc250-cu-unlock.service with the masks in /etc/bc250-cu-bisect, which writes the registers again early at every
boot. Nothing is written to the BIOS, the firmware, the CMOS or the kernel's arguments. Uninstall in CU Unlock
disables the service and removes its files; the unlock lasts until the next reboot, and the board is then stock.
CU Bisect reboots the board between its rounds, by itself with the unattended option, after a question
otherwise.
"""
category = "sustainable"
install = ["bash packaging/bazzite/install-bisect-gui.sh", "bash packaging/bazzite/install-gui.sh"]
uninstall = ["bash packaging/bazzite/uninstall-bisect-gui.sh", "bash packaging/bazzite/uninstall-gui.sh"]
detect = ["~/.local/bin/bc250-bisect-gui", "~/.local/bin/bc250-unlock-cu-gui"]
launch = [["Bisect", "~/.local/bin/bc250-bisect-gui"], ["Unlock", "~/.local/bin/bc250-unlock-cu-gui"]]

[apps.cores]
name = "BC-250 Cores Bisect"
summary = "Tell bad CPU cores apart from an unstable core unlock, before you persist the 8C/16T unlock."
tag = "cores-v0.4.2"
sha256 = "5c018e97f072e2e244becc80cb53bbdca1c587081b5df20c47b96fa1ba8940f7"
required = false
changes_board = true
board_change = """
The app sends the SoC's SMU one mailbox message over PCI configuration space with setpci, which sets the core
presence mask to 0xFF in the SMU's own memory; the governor's service is stopped around the message, as it
shares the mailbox, and started again. The mask takes effect on the next warm reboot, survives warm reboots, and
a full power off reverts it to the stock 6 cores. The 8 cores stay across power offs only through the root
service that Cores Unlock installs, bc250-cores-unlock.service, which sends the message again after a cold boot
and warm-reboots once, with a guard against reboot loops. Nothing is written to the BIOS, the firmware, the CMOS
or the kernel's arguments. Uninstall in Cores Unlock disables the service and removes its files; the cores stay
on until the next full power off, and the board is then stock. Cores Bisect reboots the board between its
rounds, by itself with the unattended option, after a question otherwise.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-cores-bisect-gui", "~/.local/bin/bc250-cores-unlock-gui"]
launch = [["Bisect", "~/.local/bin/bc250-cores-bisect-gui"], ["Unlock", "~/.local/bin/bc250-cores-unlock-gui"]]

[apps.oc]
name = "BC-250 GPU OC Bisect"
summary = "Find your board's safe GPU overclock and undervolt, one step at a time."
tag = "oc-v0.3.2"
sha256 = "d24d87a0986fbb285bab6193fd8a28e7f75eb98047cdf57e64cd7a8ab13bfee2"
required = false
changes_board = true
board_change = """
The app only changes the GPU governor's settings file, /etc/cyan-skillfish-governor-smu/config.toml: for each
attempt it puts a test clock and voltage in it and restarts the governor, which applies them, and puts your own
file back after the attempt, on a temperature abort and when it exits. It never writes a register itself.
Install writes the found safe point into the file, with a copy of the file from before it beside it, and
restarts the governor; the file stays across reboots and power offs. A crash during an attempt can leave the
test settings in the file until the script runs again and restores it first. Nothing is written to the BIOS, the
firmware, the CMOS or the kernel's arguments. Uninstall copies the file from before the install back and
restarts the governor.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-gpu-oc-bisect-gui"]
launch = [["Open", "~/.local/bin/bc250-gpu-oc-bisect-gui"]]

[apps.acpi]
name = "BC-250 Persistent ACPI"
summary = "CPU C-states and frequency scaling through a persistent ACPI override (GRUB early initrd)."
tag = "acpi-v0.4.2"
sha256 = "bc20eadb5fd9e833121137771ae81a45174291f545d172a1506c210bbbf6afef"
required = false
changes_board = true
board_change = """
The app copies three ACPI tables to /boot/acpi_override.cpio and adds one line to /etc/default/grub, then
regenerates the GRUB configuration. At every boot GRUB hands the tables to the kernel, which uses them in memory
instead of the BIOS's own. Both files stay across reboots, power offs and Bazzite updates. Nothing is written to
the BIOS, the firmware or the CMOS: the BIOS keeps its own tables, and the override is gone the moment the two
files are. Uninstall removes the file and the line, puts back any line that was there before, and regenerates
GRUB; after the next reboot the board runs on the BIOS's tables again.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-persistent-acpi-gui"]
launch = [["Open", "~/.local/bin/bc250-persistent-acpi-gui"]]

