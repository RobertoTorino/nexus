# SPDX-License-Identifier: GPL-3.0-or-later
# The apps of this portal release: one tested combination. Each [apps.<name>] pins one release tag of that app.
#
# Rules (CI, tools/check_manifest.py):
#  * a change to this file needs a portal/VERSION bump at least as large as the largest app bump it pins
#    (an app patch release -> at least a portal patch release, an app minor -> at least a portal minor, ...);
#  * every tag must exist when the portal is released; on main a tag may be one that is about to be released
#    (its version equals that app's VERSION).
#
# Fields:
#   name, summary   shown on the pill
#   short           optional: the name on the tile (default: name without its "BC-250 " or "BC250 " prefix)
#   tag             the pinned release: <name>-v<x.y.z>; asset <tag>.tar.gz with SHA256SUMS on the suite release
#   sha256          of <tag>.tar.gz; filled in when the tag is released (empty: checked against SHA256SUMS only)
#   required        installed with the portal and always listed first (only check)
#   changes_board   true: the portal warns before installing or opening it
#   board_change    with changes_board: what the app touches on the board, what stays after a reboot or a power
#                   off, what it never touches and how it is undone, in a few plain sentences (no Markdown). The
#                   tile's tooltip shows it, and the app's wiki chapter opens with the same text in a
#                   "Changes the board" box (check_manifest.py keeps them the same)
#   category        sustainable, graphics, gaming or utilities: the app's tab in the portal; the same
#                   category as its icon in icons/categories.toml (tools/tests/test_icons.py)
#   withdrawn       optional: "<reason>" when the pinned release was withdrawn; the portal removes the app
#   install         shell commands run in a terminal from the extracted release folder, in order
#   uninstall       idem, for removal
#   detect          paths whose existence means "installed" (any of them)
#   launch          [[label, command]] to open the app; none for apps that are not programs
#
# Only released apps are listed: the tools that run from the checkout (the Nexus apps in dev/) are
# started there (owner, 27-10-2026: no Development tab).

[apps.check]
name = "BC-250 Bazzite Test"
summary = "Read-only diagnostics, stress test and benchmarks. Always installed."
tag = "check-v1.2.0"
sha256 = "653d1edeef721478e001625068bf1431bde72de62e133bd620690e00d612b817"
required = true
changes_board = false
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-bazzite-test"]
launch = [["Open", "~/.local/bin/bc250-bazzite-test"]]

[apps.gpu]
name = "BC-250 GPU Governor Manager"
summary = "Manage the cyan-skillfish GPU governor: tuning, safe points, profiles, backups."
tag = "gpu-v0.4.2"
sha256 = "840b38561da6a100b827dc3b88a5f243272a72583013f5e6200272f8f268b9ac"
required = false
changes_board = true
board_change = """
The app edits the governor's settings file, /etc/cyan-skillfish-governor-smu/config.toml, and makes a dated
backup of it beside it before every write; it starts, stops, enables and disables the governor's service, and
sends it clock, voltage and range requests over D-Bus. The governor is what sets the GPU's clocks and voltages;
the app never writes a register itself. The settings file stays across reboots and power offs, and the governor
reads it whenever it starts; what the app sets over D-Bus, test mode included, lasts until the governor
restarts. Nothing is written to the BIOS, the firmware, the CMOS or the kernel's arguments. Restore on the
Backups page makes any earlier settings file the current one again, and Stop test ends a test; uninstalling the
app leaves the settings file and its backups as they are.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-governor-manager"]
launch = [["Open", "~/.local/bin/bc250-governor-manager"]]

