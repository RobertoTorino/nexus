sha256 = "d773fb45ab74bc2a2ff893e26bef97a8385b89bab6cef284f1756721ba37f38a"
required = true
changes_board = false
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
