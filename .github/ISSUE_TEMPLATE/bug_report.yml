name: Bug report
description: Something in Nexus doesn't work: a Nexus app, a tool, core or the Nexus page.
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Nexus Dashboard
        - Nexus Release Tool
        - Nexus Demo Recorder
        - Nexus Deps
        - Nexus Installer Tests
        - Nexus Sound Lab
        - a tool in tools/
        - core (bc250_core)
        - the Nexus page
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The app's version in its window's header, or `--version`; for a tool, the commit of the checkout.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Bazzite (`rpm-ostree status`, the Version line of the deployment marked ●) or Windows.
      placeholder: "42.20261001.0 (2026-10-01T04:43:45Z)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or log
      description: What the app or tool printed. Drag the file here or paste the relevant part.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I read what I attached and removed anything I don't want to share.
          required: true
