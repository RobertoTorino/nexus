# SPDX-License-Identifier: GPL-3.0-or-later
name: Release Windows Portable

# One GitHub release per tag of the Windows Portable Suite: wp-<app>-v<x.y.z> (wp-test-v0.1.0). The tag's version must
# equal that app's VERSION. Apart from release.yml (the BC250 Bazzite Suite's), which leaves wp- tags alone, so a
# change here never touches the other suite's releases (owner, 27-10-2026).
#
# The assets are <tag>.zip (the app's one-folder PyInstaller build with its install.ps1), SHA256SUMS and the notes,
# built on Windows by windows-portable/tools/build_release.py. A portal release (wp-portal-v<x.y.z>) bundles the
# release of Windows Portable Test that windows-portable/portal/apps.toml pins (downloaded from its own release and
# checked against the pin) and requires every pinned tag to exist. Never GitHub's "Latest": that is the Nexus index
# (nexus-index.yml, written again once this run succeeded), which points at every suite's newest portal and, while
# this suite has none, at its apps' newest releases.
#
# Only a commit that CI passed becomes a release: the first job waits for ci-windows-portable.yml on the tagged
# commit and for Nexus's ci-nexus.yml (core, which every app bundles, the release tools and the repository's
# rules), up to 75 minutes each. tools/tag-release.sh asks the same before it tags.

on:
  push:
    tags: ["wp-*-v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 155                # ci_state waits up to 75, twice (both workflows run on the same push, so
    permissions:                        # the second wait is mostly over already)
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_state.py --workflow ci-windows-portable.yml --wait 75 "$GITHUB_SHA"
      - name: Nexus's CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_state.py --workflow ci-nexus.yml --wait 75 "$GITHUB_SHA"

  release:
    needs: ci
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # tags, for check_manifest and the zip's file times

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Checks
        run: |
          python tools/check_versions.py --suite windows-portable
          app=${TAG#wp-}; app=${app%-v*}
          case "$app" in
            portal) python windows-portable/tools/check_manifest.py --require-tags
                    python -m pip install -q -r windows-portable/portal/requirements.txt pyinstaller pillow ;;
            *)      python windows-portable/tools/check_manifest.py
                    python -m pip install -q -r "windows-portable/apps/$app/requirements.txt" pyinstaller pillow ;;
          esac

      - name: Bundled Windows Portable Test (portal releases)
        if: startsWith(github.ref_name, 'wp-portal-v')
        run: |
          bt=$(python -c 'import tomllib; print(tomllib.load(open("windows-portable/portal/apps.toml", "rb"))["apps"]["test"]["tag"])')
          mkdir -p bundle
          gh release download "$bt" --pattern "$bt.zip" --pattern SHA256SUMS --dir bundle

      - name: Build
        run: |
          args=()
          [ -d bundle ] && args+=(--bundle bundle)
          python windows-portable/tools/build_release.py "$TAG" dist "${args[@]}"
          cat dist/SHA256SUMS

      - name: Publish
        run: |
          title=$(cat dist/title.txt)   # the suite's and the app's names (build_release.py's release_title)
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "dist/$TAG.zip" dist/SHA256SUMS --clobber && exit 0
            elif gh release create "$TAG" "dist/$TAG.zip" dist/SHA256SUMS \
                   --title "$title" --notes-file dist/notes.md --verify-tag --latest=false; then
              exit 0
            fi
            [ "$attempt" = 5 ] && break
            echo "Publishing failed (try $attempt of 5); again in $((attempt * 30)) s" >&2
            sleep $((attempt * 30))
          done
          echo "Publishing $TAG failed five times." >&2
          exit 1
