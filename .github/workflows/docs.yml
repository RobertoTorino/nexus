# SPDX-License-Identifier: GPL-3.0-or-later
name: Manual

# Builds the manual (MkDocs Material) from main and publishes it on GitHub Pages (Settings -> Pages -> Source:
# GitHub Actions): the Nexus page (nexus/) at https://robertotorino.github.io/nexus/ and the BC250 Bazzite Suite's
# wiki (bc250-bazzite/docs/) at https://robertotorino.github.io/nexus/bc250-bazzite-suite/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2" "pillow>=12,<13"   # pillow: the WebP copies of the app pictures
      - name: Qt runtime libraries and Bazzite's font
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 fonts-noto-core
      - name: The portal's picture on the home page, from the portal on main
        run: |
          python -m pip install -q -r bc250-bazzite/portal/requirements.txt
          QT_QPA_PLATFORM=offscreen python bc250-bazzite/tools/portal_screenshot.py
      - run: mkdocs build --strict -f nexus/mkdocs.yml --site-dir "$PWD/site"   # first: a build empties its folder
      - run: mkdocs build --strict -f bc250-bazzite/mkdocs.yml --site-dir "$PWD/site/bc250-bazzite-suite"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
