name: Manual

# Builds the manual (MkDocs Material) from main and publishes it on GitHub Pages (Settings -> Pages -> Source:
# GitHub Actions): the Nexus page (nexus/) at https://robertotorino.github.io/nexus/ and the Windows Portable
# Suite's wiki at https://robertotorino.github.io/nexus/windows-portable-suite/, the address it always had. The BC250
# Bazzite Suite's wiki is published by its own repository, at https://robertotorino.github.io/bc250-bazzite/
# (14-11-2026). The Windows Portable Suite has
# a repository of its own (owner, 13-11-2026), checked out here as windows-portable/, where its wiki finds the Nexus
# tools' hooks; a change to its wiki is published by the next run here: a push to Nexus's main, the nightly run, or
# Run workflow (gh workflow run docs.yml --repo RobertoTorino/nexus).

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 3 * * *"        # nightly, 03:40 UTC: what a suite in a repository of its own changed in its wiki
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7       # the Windows Portable Suite, as its folder in the Nexus checkout
        with:
          repository: RobertoTorino/windows-portable
          path: windows-portable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2" "pillow>=12,<13"   # pillow: the WebP copies of the app pictures
      - run: mkdocs build --strict -f nexus/mkdocs.yml --site-dir "$PWD/site"   # first: a build empties its folder
      # A suite in a repository of its own whose repository has no wiki yet (before its first push) is left out, with
      # a warning, so the other wikis are still published.
      - name: The Windows Portable Suite's wiki
        run: |
          if [ -f windows-portable/mkdocs.yml ]; then
            mkdocs build --strict -f windows-portable/mkdocs.yml --site-dir "$PWD/site/windows-portable-suite"
          else
            echo "::warning::RobertoTorino/windows-portable has no mkdocs.yml: its wiki is not published by this run"
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
