# SPDX-License-Identifier: GPL-3.0-or-later
name: CI Windows Portable

# The checks of the Windows Portable Suite (windows-portable/) on every push and pull request that changes the suite
# or what its releases are built from (core, which its apps bundle; the Nexus tools; Nexus Releases' Windows
# installer, tested here), apart from ci.yml (the BC250 Bazzite Suite) and ci-nexus.yml (Nexus), so that one suite's
# checks never block another suite's releases and a push to one suite runs no other suite's CI (owner, 27-10-2026 and
# 29-10-2026). Its tags (wp-<app>-v<x.y.z>) wait for this workflow on the commit (tools/ci_state.py --workflow
# ci-windows-portable.yml, as tools/tag-release.sh and release-windows-portable.yml ask): a release commit changes
# the suite (its VERSION and CHANGELOG), so it has a run. The suite's tests run on Windows, the system it is made
# for, in Windows PowerShell as on the handheld; core with them, as its apps bundle it.
# A tag starts no run of its own, as for ci.yml.

on:
  push:
    branches: ["**"]
    paths:
      - "windows-portable/**"
      - "core/**"                       # bundled in every app
      - "tools/**"                      # the release tools (stage_app.py, check_versions.py)
      - "dev/releases/**"               # Nexus Releases' Windows installer: installer-tests/releases.ps1
      - "requirements-dev.txt"
      - ".github/workflows/ci-windows-portable.yml"
      - ".github/workflows/release-windows-portable.yml"
  pull_request:
    paths:
      - "windows-portable/**"
      - "core/**"
      - "tools/**"
      - "dev/releases/**"
      - "requirements-dev.txt"
      - ".github/workflows/ci-windows-portable.yml"
      - ".github/workflows/release-windows-portable.yml"

jobs:

  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # the base commit and the tags, for check_manifest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hard-coded versions match each VERSION file
        run: python tools/check_versions.py --suite windows-portable
      - name: Portal manifest
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python windows-portable/tools/check_manifest.py ${BASE:+--base "$BASE"}
      - name: Every former repo has its LICENSE, .gitignore, VERSION and CHANGELOG
        run: |
          rc=0
          for d in windows-portable/portal windows-portable/apps/*; do
            for f in LICENSE .gitignore VERSION CHANGELOG; do
              [ -f "$d/$f" ] || { echo "::error::$d/$f missing"; rc=1; }
            done
          done
          exit $rc

  docs:
    # The suite's wiki (windows-portable/docs/), as docs.yml builds it for GitHub Pages.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2"
      - run: mkdocs build --strict -f windows-portable/mkdocs.yml

  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: [core, windows-portable/portal, windows-portable/tools,
              windows-portable/apps/test,
              windows-portable/apps/pcsx2,
              windows-portable/apps/ppsspp,
              windows-portable/apps/rpcs3,
              windows-portable/apps/shadps4]   # every folder of the suite with tests/, and core, which its apps bundle
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # the tags: windows-portable/tools checks the shipped apps.toml, whose pins must exist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements-dev.txt"
      - name: Install
        run: python -m pip install -q -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests

  installers:
    # Each app and the portal in a job of its own (owner, 29-10-2026: one job doing them all in a row took six to
    # fifteen minutes, the longest wait of every push and so of every release): its installer test, then its release
    # built as release-windows-portable.yml builds it (not published) and installed by the installer test on that
    # release. The portal's bundles the pinned Windows Portable Test release, downloaded from GitHub as the release
    # workflow does. new_app.py adds a new app to the matrix.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [test, pcsx2, ppsspp, rpcs3, shadps4, portal]   # every app of the suite, and the portal
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # the commit time, the zip's file times
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "windows-portable/**/requirements.txt"
      - name: Installer test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows-portable/tools/installer-tests/${{ matrix.app }}.ps1
      - name: The pinned Windows Portable Test release, for the portal's bundle
        if: matrix.app == 'portal'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(python -c 'import tomllib; print(tomllib.load(open("windows-portable/portal/apps.toml", "rb"))["apps"]["test"]["tag"])')
          mkdir -p bundle
          gh release download "$bt" --pattern "$bt.zip" --pattern SHA256SUMS --dir bundle
      - name: Build the release zip, not published
        shell: bash
        run: |
          case "$APP" in
            portal) folder=windows-portable/portal ;;
            *)      folder=windows-portable/apps/$APP ;;
          esac
          python -m pip install -q -r "$folder/requirements.txt" pyinstaller pillow
          args=()
          [ -d bundle ] && args+=(--bundle bundle)
          python windows-portable/tools/build_release.py "wp-$APP-v$(cat "$folder/VERSION")" wpdist "${args[@]}"
      - name: Installer test on the release
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File windows-portable/tools/installer-tests/${{ matrix.app }}.ps1
          -Release (Get-Item wpdist/*.zip).FullName

  nexus-releases-installer:
    # Nexus Releases' Windows installer (dev/releases/install.ps1) is tested here: this suite is the one on Windows.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: "Installer test: releases"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows-portable/tools/installer-tests/releases.ps1
