# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# The checks of the BC250 Bazzite Suite (bc250-bazzite/) on every push and pull request that changes the suite or
# what its releases are built from (core, the Nexus tools, dev/, the root's copy of its apps.toml, test.sh): a push
# to another suite alone runs no job here (owner, 29-10-2026: "why run a bazzite CI when releasing Windows"). Releases
# are made by release.yml, one per tag. The Windows Portable Suite has its own, ci-windows-portable.yml, and Nexus's
# shared checks (core, the Nexus tools, dev/, the Nexus page and the repository's rules) run in ci-nexus.yml (owner,
# 27-10-2026: one suite's checks never block another suite's releases). This suite's tags wait for this workflow
# and for ci-nexus.yml (tools/tag-release.sh, the ci job of release.yml); a release commit changes the suite (its
# VERSION and CHANGELOG), so it has a run.
# A tag starts no CI of its own: tools/tag-release.sh tags only a pushed commit CI passed, and release.yml waits for
# that commit's CI. A run per tag (22 in one release) only queued the same jobs again and gave each release one more
# run that could fail or hang.
# Every job has a time limit far above its usual minute or two, so a hanging test fails the run instead of holding
# it (and every release waiting for it) for GitHub's six hours.

on:
  push:
    branches: ["**"]                    # every branch, no tag. Not tags-ignore alone: GitHub then runs no branch push
    paths:
      - "bc250-bazzite/**"
      - "core/**"                       # bundled in every app
      - "tools/**"                      # the release tools
      - "dev/**"                        # Nexus Release Tool: installer-tests/nrt.sh
      - "portal/**"                     # the root's copy of the suite's apps.toml
      - "test.sh"
      - "requirements-dev.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "bc250-bazzite/**"
      - "core/**"
      - "tools/**"
      - "dev/**"
      - "portal/**"
      - "test.sh"
      - "requirements-dev.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # the base commit and the tags, for check_manifest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hard-coded versions match each VERSION file
        run: python tools/check_versions.py --suite bc250-bazzite
      # apps.toml: every app listed, pinned tags exist (or are the next release), and a change to it since the last
      # portal release comes with a big enough portal/VERSION bump (bc250-bazzite/tools/check_manifest.py).
      - name: Portal manifest
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python bc250-bazzite/tools/check_manifest.py ${BASE:+--base "$BASE"}

  plan:
    # The pytest matrix, read from the suite's folders (tools/ci_matrix.py: every folder with tests/), so a new app
    # needs no edit here (stage 2 of the release redesign, 04-11-2026). Nexus's folders (core, tools, dev/):
    # ci-nexus.yml; the Windows Portable Suite's: ci-windows-portable.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.plan.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
      - name: The folders with tests
        id: plan
        run: python3 tools/ci_matrix.py --suite bc250-bazzite pytest | tee -a "$GITHUB_OUTPUT"

  pytest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.plan.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # the tags: tools/tests checks the shipped apps.toml, whose pins must exist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements-dev.txt"

      - name: Qt runtime libraries
        timeout-minutes: 5                    # a stalled mirror fails here, by name, not after the job's 20
        working-directory: .                  # the script's path is from the root, not the matrix folder
        run: bash tools/ci-qt-libs.sh --pulse

      - name: Install
        run: python -m pip install -q -r requirements-dev.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests        # -v: a crash log names the test

  # PS Remote Play's native core (Rust, bc250-bazzite/apps/consoles/native): its own tests, clippy, and the Python module
  # built into a wheel and tested from Python, all with the video decoder (FFmpeg from native/ffmpeg/build.sh, kept
  # in the cache until the script changes); clippy also without it, as a clone without FFmpeg builds it. Rust is
  # preinstalled on ubuntu-latest. The pytest job above skips tests/test_native.py, which needs the built module.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bc250-bazzite/apps/consoles/native
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: nasm and the libva headers
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm libva-dev

      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache@v6
        with:
          path: ~/.cache/bc250-console-link
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('bc250-bazzite/apps/consoles/native/ffmpeg/build.sh') }}

      - name: FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: ffmpeg/build.sh

      - name: cargo test
        run: cargo test --locked --features decoder

      - name: clippy
        run: |
          cargo clippy --locked --all-targets --features python,decoder -- -D warnings
          cargo clippy --locked --all-targets --features python -- -D warnings

      - name: Build the Python module
        run: |
          python -m pip install -q "maturin>=1.5,<2"
          maturin build --release --locked --compatibility linux --features python,pyo3/extension-module,decoder -o dist

      - name: Test the module from Python
        working-directory: bc250-bazzite/apps/consoles         # the app's package imports from here, as in test.sh
        run: |
          python -m pip install -q -r requirements-dev.txt native/dist/*.whl     # conftest.py uses PyQt6
          python -m pytest -v tests/test_native.py tests/test_stream.py tests/test_senkusha.py

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: bash -n
        run: |
          rc=0
          while IFS= read -r -d '' f; do bash -n "$f" || { echo "::error file=$f::syntax error"; rc=1; }; done \
            < <(find bc250-bazzite -name '*.sh' -print0)
          exit $rc

      # shellcheck is preinstalled on ubuntu-latest. Error level for everything; warning level for the scripts
      # that their own release workflows already held to it. The Nexus tools, test.sh and dev/: ci-nexus.yml.
      - name: shellcheck (errors, all scripts)
        run: find bc250-bazzite -name '*.sh' -print0 | xargs -0 shellcheck -x -S error
      - name: shellcheck (warnings, the installers, the run wrappers, the suite's own scripts and the app scripts that hold to it)
        # Every install.sh and bc250-*-run wrapper by glob, so a new app's are checked without an edit here; the
        # rest by name: scripts the baseline holds to it (test-bazzite.sh and the bisect scripts do not).
        run: |
          shellcheck -x -S warning bc250-bazzite/install.sh bc250-bazzite/portal/install.sh bc250-bazzite/apps/*/install.sh \
            bc250-bazzite/apps/*/bc250-*-run bc250-bazzite/tools/*.sh bc250-bazzite/tools/installer-tests/*.sh
          shellcheck -S warning bc250-bazzite/apps/cores/bc250-cores-bisect.sh bc250-bazzite/apps/cores/bc250-cores-unlock.sh \
            bc250-bazzite/apps/cores/packaging/bazzite/*.sh
          shellcheck -S warning bc250-bazzite/apps/oc/bc250-gpu-oc-bisect.sh bc250-bazzite/apps/acpi/bc250-acpi-override.sh
          shellcheck -S warning bc250-bazzite/apps/ace/bc250-ace-queues.sh bc250-bazzite/apps/ace/mesa/build-in-container.sh \
            bc250-bazzite/apps/mesh/bc250-mesh-shaders.sh bc250-bazzite/apps/mesh/mesa/build-in-container.sh

      # The repository's rules (line endings, exec bits, workflows only at the root): ci-nexus.yml.
      - name: Every former repo has its LICENSE, .gitignore, VERSION and CHANGELOG
        run: |
          rc=0
          for d in bc250-bazzite/portal bc250-bazzite/apps/*; do
            for f in LICENSE .gitignore VERSION CHANGELOG; do
              [ -f "$d/$f" ] || { echo "::error::$d/$f missing"; rc=1; }
            done
          done
          exit $rc

  # The installers on Linux without root or network: sudo becomes fakeroot, venvs are stubs (see shims.sh).
  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: fakeroot
        run: sudo apt-get install -y -q fakeroot
      - name: Every installer test (bc250-bazzite/tools/installer-tests/*.sh), then the release tarballs end to end
        # Read from the folder, so a new app's test runs without an edit here (stage 2, 04-11-2026); each in a
        # group of its own in the log, every one run, the failed ones named at the end.
        run: |
          failed=()
          run() { echo "::group::${1##*/}"; bash "$1" || { echo "::error file=$1::${1##*/} failed"; failed+=("${1##*/}"); }; echo "::endgroup::"; }
          for t in bc250-bazzite/tools/installer-tests/*.sh; do
            case "${t##*/}" in shims.sh|release.sh) continue ;; esac
            run "$t"
          done
          run bc250-bazzite/tools/installer-tests/release.sh
          [ ${#failed[@]} -eq 0 ] || { echo "Failed: ${failed[*]}" >&2; exit 1; }

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2" "pillow>=12,<13"   # pillow: the WebP copies of the app pictures
      - name: Qt runtime libraries
        timeout-minutes: 5
        run: bash tools/ci-qt-libs.sh
      - name: The portal's picture on the home page, as docs.yml takes it
        run: |
          python -m pip install -q -r bc250-bazzite/portal/requirements.txt
          QT_QPA_PLATFORM=offscreen python bc250-bazzite/tools/portal_screenshot.py
      - run: mkdocs build --strict -f bc250-bazzite/mkdocs.yml     # the Nexus page: ci-nexus.yml

  windows-exe:
    # The Windows executables of the release workflow, built here too so a broken build shows before a tag.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r bc250-bazzite/apps/sftp/requirements.txt pyinstaller pillow
      - run: python tools/build_windows_exe.py sftp windist
