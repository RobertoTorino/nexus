# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# The checks of Nexus (core, the tools, dev/) and of the BC250 Bazzite Suite on every push and pull request. Releases
# are made by release.yml, one per tag. The Windows Portable Suite has its own, ci-windows-portable.yml (owner,
# 27-10-2026: one suite's checks never block another suite's releases).
# A tag starts no CI of its own: tools/tag-release.sh tags only a pushed commit CI passed, and release.yml waits for
# that commit's CI. A run per tag (22 in one release) only queued the same jobs again and gave each release one more
# run that could fail or hang.
# Every job has a time limit far above its usual minute or two, so a hanging test fails the run instead of holding
# it (and every release waiting for it) for GitHub's six hours.

on:
  push:
    branches: ["**"]                    # every branch, no tag. Not tags-ignore alone: GitHub then runs no branch push
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # the base commit and the tags, for check_manifest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hard-coded versions match each VERSION file
        run: python tools/check_versions.py --suite bc250-bazzite
      # apps.toml: every app listed, pinned tags exist (or are the next release), and a change to it since the last
      # portal release comes with a big enough portal/VERSION bump (bc250-bazzite/tools/check_manifest.py).
      - name: Portal manifest
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python bc250-bazzite/tools/check_manifest.py ${BASE:+--base "$BASE"}
      # A CHANGELOG is history: every entry it had at the base is still there.
      - name: CHANGELOGs keep their entries
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_changelogs.py ${BASE:+--base "$BASE"}

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: [core, tools, bc250-bazzite/portal, bc250-bazzite/tools,
              bc250-bazzite/apps/check, bc250-bazzite/apps/gpu, bc250-bazzite/apps/upscaler, bc250-bazzite/apps/acpi,
              bc250-bazzite/apps/compute, bc250-bazzite/apps/cores, bc250-bazzite/apps/oc, bc250-bazzite/apps/mtool,
              bc250-bazzite/apps/package, bc250-bazzite/apps/ncgui, dev/releases,
              bc250-bazzite/apps/overlay, bc250-bazzite/apps/ips35, bc250-bazzite/apps/hdcam,
              bc250-bazzite/apps/hdcontrol, bc250-bazzite/apps/bios, bc250-bazzite/apps/ace, bc250-bazzite/apps/vram,
              bc250-bazzite/apps/cec, bc250-bazzite/apps/sftp, bc250-bazzite/apps/consoles, bc250-bazzite/apps/clb,
              bc250-bazzite/apps/mesh, bc250-bazzite/apps/shadps4, bc250-bazzite/apps/rpcs3,
              bc250-bazzite/apps/decky, bc250-bazzite/apps/datstation, bc250-bazzite/apps/ppsspp,
              bc250-bazzite/apps/pcsx2, bc250-bazzite/apps/vita3k, bc250-bazzite/apps/fan,
              bc250-bazzite/apps/wdriver, bc250-bazzite/apps/xenia, bc250-bazzite/tools/installer-tests/gui]
              # every folder with tests/ of Nexus and this suite; the Windows Portable Suite's: ci-windows-portable.yml
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # the tags: tools/tests checks the shipped apps.toml, whose pins must exist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements-dev.txt"

      - name: Qt runtime libraries
        timeout-minutes: 5                    # a stalled mirror fails here, by name, not after the job's 20
        working-directory: .                  # the script's path is from the root, not the matrix folder
        run: bash tools/ci-qt-libs.sh --pulse

      - name: Install
        run: python -m pip install -q -r requirements-dev.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests        # -v: a crash log names the test

  # Console Link's native core (Rust, bc250-bazzite/apps/consoles/native): its own tests, clippy, and the Python module
  # built into a wheel and tested from Python, all with the video decoder (FFmpeg from native/ffmpeg/build.sh, kept
  # in the cache until the script changes); clippy also without it, as a clone without FFmpeg builds it. Rust is
  # preinstalled on ubuntu-latest. The pytest job above skips tests/test_native.py, which needs the built module.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bc250-bazzite/apps/consoles/native
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: nasm and the libva headers
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm libva-dev

      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache@v6
        with:
          path: ~/.cache/bc250-console-link
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('bc250-bazzite/apps/consoles/native/ffmpeg/build.sh') }}

      - name: FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: ffmpeg/build.sh

      - name: cargo test
        run: cargo test --locked --features decoder

      - name: clippy
        run: |
          cargo clippy --locked --all-targets --features python,decoder -- -D warnings
          cargo clippy --locked --all-targets --features python -- -D warnings

      - name: Build the Python module
        run: |
          python -m pip install -q "maturin>=1.5,<2"
          maturin build --release --locked --compatibility linux --features python,pyo3/extension-module,decoder -o dist

      - name: Test the module from Python
        working-directory: bc250-bazzite/apps/consoles         # the app's package imports from here, as in test.sh
        run: |
          python -m pip install -q -r requirements-dev.txt native/dist/*.whl     # conftest.py uses PyQt6
          python -m pytest -v tests/test_native.py tests/test_stream.py tests/test_senkusha.py

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: bash -n
        run: |
          rc=0
          while IFS= read -r -d '' f; do bash -n "$f" || { echo "::error file=$f::syntax error"; rc=1; }; done \
            < <(find bc250-bazzite tools test.sh -name '*.sh' -print0)
          exit $rc

      # shellcheck is preinstalled on ubuntu-latest. Error level for everything; warning level for the scripts
      # that their own release workflows already held to it.
      - name: shellcheck (errors, all scripts)
        run: find bc250-bazzite tools test.sh -name '*.sh' -print0 | xargs -0 shellcheck -x -S error
      - name: shellcheck (warnings, cores, oc, acpi, overlay, ips35, hdcam, hdcontrol, bios, ace, vram, fan, wdriver, cec, sftp, consoles, clb, mesh, shadps4, rpcs3, ppsspp, pcsx2, vita3k, xenia, decky, netcatgui, datstation and the suite's own scripts)
        run: |
          shellcheck -x -S warning bc250-bazzite/portal/install.sh bc250-bazzite/apps/check/install.sh tools/*.sh bc250-bazzite/tools/*.sh \
            bc250-bazzite/tools/installer-tests/*.sh \
            test.sh bc250-bazzite/install.sh tools/hooks/pre-push
          shellcheck -S warning bc250-bazzite/apps/cores/bc250-cores-bisect.sh bc250-bazzite/apps/cores/bc250-cores-unlock.sh \
            bc250-bazzite/apps/cores/install.sh bc250-bazzite/apps/cores/packaging/bazzite/*.sh
          shellcheck -S warning bc250-bazzite/apps/oc/bc250-gpu-oc-bisect.sh bc250-bazzite/apps/oc/install.sh
          shellcheck -S warning bc250-bazzite/apps/acpi/bc250-acpi-override.sh bc250-bazzite/apps/acpi/install.sh
          shellcheck -S warning bc250-bazzite/apps/overlay/install.sh bc250-bazzite/apps/ips35/install.sh bc250-bazzite/apps/hdcam/install.sh bc250-bazzite/apps/bios/install.sh \
            bc250-bazzite/apps/vram/install.sh bc250-bazzite/apps/hdcontrol/install.sh
          shellcheck -S warning bc250-bazzite/apps/fan/install.sh bc250-bazzite/apps/wdriver/install.sh
          shellcheck -S warning bc250-bazzite/apps/cec/install.sh bc250-bazzite/apps/sftp/install.sh bc250-bazzite/apps/consoles/install.sh \
            bc250-bazzite/apps/clb/install.sh
          shellcheck -S warning bc250-bazzite/apps/ace/bc250-ace-queues.sh bc250-bazzite/apps/ace/bc250-ace-queues-run \
            bc250-bazzite/apps/ace/install.sh bc250-bazzite/apps/ace/mesa/build-in-container.sh
          shellcheck -S warning bc250-bazzite/apps/mesh/bc250-mesh-shaders.sh bc250-bazzite/apps/mesh/bc250-mesh-shaders-run \
            bc250-bazzite/apps/mesh/install.sh bc250-bazzite/apps/mesh/mesa/build-in-container.sh
          shellcheck -S warning bc250-bazzite/apps/shadps4/install.sh bc250-bazzite/apps/shadps4/bc250-shadps4-run
          shellcheck -S warning bc250-bazzite/apps/rpcs3/install.sh bc250-bazzite/apps/rpcs3/bc250-rpcs3-run
          shellcheck -S warning bc250-bazzite/apps/ppsspp/install.sh bc250-bazzite/apps/ppsspp/bc250-ppsspp-run
          shellcheck -S warning bc250-bazzite/apps/pcsx2/install.sh bc250-bazzite/apps/pcsx2/bc250-pcsx2-run
          shellcheck -S warning bc250-bazzite/apps/vita3k/install.sh bc250-bazzite/apps/vita3k/bc250-vita3k-run
          shellcheck -S warning bc250-bazzite/apps/xenia/install.sh bc250-bazzite/apps/xenia/bc250-xenia-run
          shellcheck -S warning bc250-bazzite/apps/decky/install.sh
          shellcheck -S warning bc250-bazzite/apps/mtool/install.sh
          shellcheck -S warning bc250-bazzite/apps/package/install.sh
          shellcheck -S warning bc250-bazzite/apps/ncgui/install.sh
          shellcheck -S warning bc250-bazzite/apps/datstation/install.sh
          shellcheck -S warning dev/releases/*.sh bc250-bazzite/tools/check-release.sh

      - name: Line endings
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)' ; then echo "::error::CRLF in the index (see above)"; exit 1; fi

      # Commits made from Windows record new files as 100644 (core.fileMode=false); tools/fix-modes.sh repairs it.
      - name: Scripts are executable
        run: |
          missing=$(git ls-files -s -- '*.sh' 'tools/hooks/*' | awk '$1 != "100755" { print $4 }')
          if [ -n "$missing" ]; then
            echo "::error::not executable in git (run tools/fix-modes.sh):"; echo "$missing"; exit 1
          fi

      - name: Every former repo has its LICENSE, .gitignore, VERSION and CHANGELOG
        run: |
          rc=0
          for d in core bc250-bazzite/portal bc250-bazzite/apps/* bc250-bazzite/tools/installer-tests/gui dev/*; do
            for f in LICENSE .gitignore VERSION CHANGELOG; do
              [ -f "$d/$f" ] || { echo "::error::$d/$f missing"; rc=1; }
            done
          done
          for f in LICENSE .gitignore CHANGELOG README.md; do
            [ -f "$f" ] || { echo "::error::$f missing at the repo root"; rc=1; }
          done
          exit $rc

      - name: Workflows only at the repo root
        run: |
          if find . -path ./.git -prune -o -path ./.github -prune -o -type d -name .github -print | grep . ; then
            echo "::error::GitHub only runs workflows from the root .github/; move these"; exit 1
          fi

  # The installers on Linux without root or network: sudo becomes fakeroot, venvs are stubs (see shims.sh).
  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: fakeroot
        run: sudo apt-get install -y -q fakeroot
      - name: check installer
        run: bash bc250-bazzite/tools/installer-tests/check.sh
      - name: gpu installer
        run: bash bc250-bazzite/tools/installer-tests/gpu.sh
      - name: upscaler installer
        run: bash bc250-bazzite/tools/installer-tests/upscaler.sh
      - name: compute installers
        run: bash bc250-bazzite/tools/installer-tests/compute.sh
      - name: cores installer
        run: bash bc250-bazzite/tools/installer-tests/cores.sh
      - name: oc installer
        run: bash bc250-bazzite/tools/installer-tests/oc.sh
      - name: portal installer
        run: bash bc250-bazzite/tools/installer-tests/portal.sh
      - name: acpi installer
        run: bash bc250-bazzite/tools/installer-tests/acpi.sh
      - name: overlay installer
        run: bash bc250-bazzite/tools/installer-tests/overlay.sh
      - name: ips35 installer
        run: bash bc250-bazzite/tools/installer-tests/ips35.sh
      - name: hdcam installer
        run: bash bc250-bazzite/tools/installer-tests/hdcam.sh
      - name: hdcontrol installer
        run: bash bc250-bazzite/tools/installer-tests/hdcontrol.sh
      - name: bios installer
        run: bash bc250-bazzite/tools/installer-tests/bios.sh
      - name: ace installer
        run: bash bc250-bazzite/tools/installer-tests/ace.sh
      - name: mesh installer
        run: bash bc250-bazzite/tools/installer-tests/mesh.sh
      - name: shadps4 installer
        run: bash bc250-bazzite/tools/installer-tests/shadps4.sh
      - name: rpcs3 installer
        run: bash bc250-bazzite/tools/installer-tests/rpcs3.sh
      - name: ppsspp installer
        run: bash bc250-bazzite/tools/installer-tests/ppsspp.sh
      - name: pcsx2 installer
        run: bash bc250-bazzite/tools/installer-tests/pcsx2.sh
      - name: vita3k installer
        run: bash bc250-bazzite/tools/installer-tests/vita3k.sh
      - name: xenia installer
        run: bash bc250-bazzite/tools/installer-tests/xenia.sh
      - name: decky installer
        run: bash bc250-bazzite/tools/installer-tests/decky.sh
      - name: vram installer
        run: bash bc250-bazzite/tools/installer-tests/vram.sh
      - name: fan installer
        run: bash bc250-bazzite/tools/installer-tests/fan.sh
      - name: wdriver installer
        run: bash bc250-bazzite/tools/installer-tests/wdriver.sh
      - name: cec installer
        run: bash bc250-bazzite/tools/installer-tests/cec.sh
      - name: sftp installer
        run: bash bc250-bazzite/tools/installer-tests/sftp.sh
      - name: consoles installer
        run: bash bc250-bazzite/tools/installer-tests/consoles.sh
      - name: clb installer
        run: bash bc250-bazzite/tools/installer-tests/clb.sh
      - name: Media Tool installer
        run: bash bc250-bazzite/tools/installer-tests/mtool.sh
      - name: Dependency checker installer
        run: bash bc250-bazzite/tools/installer-tests/package.sh
      - name: NetcatGUI installer
        run: bash bc250-bazzite/tools/installer-tests/ncgui.sh
      - name: DatStation installer
        run: bash bc250-bazzite/tools/installer-tests/datstation.sh
      - name: Nexus Releases installer
        run: bash bc250-bazzite/tools/installer-tests/releases.sh
      - name: Installer Tests installer
        run: bash bc250-bazzite/tools/installer-tests/installer-tests.sh
      - name: release tarballs, end to end
        run: bash bc250-bazzite/tools/installer-tests/release.sh

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2" "pillow>=12,<13"   # pillow: the WebP copies of the app pictures
      - name: Qt runtime libraries
        timeout-minutes: 5
        run: bash tools/ci-qt-libs.sh
      - name: The portal's picture on the home page, as docs.yml takes it
        run: |
          python -m pip install -q -r bc250-bazzite/portal/requirements.txt
          QT_QPA_PLATFORM=offscreen python bc250-bazzite/tools/portal_screenshot.py
      - run: mkdocs build --strict -f bc250-bazzite/mkdocs.yml
      - run: mkdocs build --strict -f nexus/mkdocs.yml

  windows-exe:
    # The Windows executables of the release workflow, built here too so a broken build shows before a tag.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r bc250-bazzite/apps/sftp/requirements.txt pyinstaller pillow
      - run: python tools/build_windows_exe.py sftp windist
