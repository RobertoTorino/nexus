# SPDX-License-Identifier: GPL-3.0-or-later
name: Release Bazzite Console Suite

on:
  push:
    tags: ["ps5-*-v[0-9]*.[0-9]*.[0-9]*"]
  workflow_call:
    inputs:
      commit:
        description: The release commit (main when the Nexus release started)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-bazzite-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 155
    permissions:
      actions: read
      contents: read
    outputs:
      out: ${{ steps.out.outputs.out }}
    env:
      COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - name: Not published already
        id: out
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$TAG is published already: nothing to do."
            echo "out=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.out.outputs.out != 'true'
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 2
      - name: Suite CI passed
        if: steps.out.outputs.out != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_state.py --workflow ci-bazzite-console.yml --release-commit --wait 75 "$COMMIT"
      - name: Nexus CI passed
        if: steps.out.outputs.out != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_state.py --workflow ci-nexus.yml --release-commit --wait 75 "$COMMIT"

  plan:
    needs: ci
    if: needs.ci.outputs.out != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      portal: ${{ steps.plan.outputs.portal }}
      draft: ${{ steps.plan.outputs.draft }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Checks
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          python3 tools/check_versions.py --suite bazzite-console
          case "$TAG" in
            ps5-portal-v*) python3 bazzite-console/tools/check_manifest.py --require-tags ;;
            *)             python3 bazzite-console/tools/check_manifest.py ;;
          esac
      - name: What this run releases
        id: plan
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python3 bazzite-console/tools/suite_release.py plan ${TAG:+--tag "$TAG"} | tee -a "$GITHUB_OUTPUT"

  apps:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      TAG: ${{ matrix.tag }}
      COMMIT: ${{ inputs.commit || github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Requirements
        run: |
          app=${TAG#ps5-}; app=${app%-v*}
          python -m pip install -q -r "bazzite-console/apps/$app/requirements.txt"
      - name: Native wheel (Console Link releases)
        if: startsWith(matrix.tag, 'ps5-consoles-v')
        working-directory: bazzite-console/apps/consoles/native
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nasm libva-dev
          ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg"
          python -m pip install -q "maturin>=1.5,<2"
          PS5_FFMPEG_DIR="$RUNNER_TEMP/ffmpeg" maturin build --release --locked --compatibility linux \
            --features python,pyo3/extension-module,decoder -o wheel
      - name: Build
        run: |
          python tools/build_release.py "$TAG" dist
          cat dist/SHA256SUMS
      - name: Publish
        run: bash bazzite-console/tools/publish_release.sh "$TAG" "$COMMIT" dist

  pin:
    needs: [plan, apps]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.portal != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    env:
      COMMIT: ${{ inputs.commit || github.sha }}
      APPS: ${{ needs.plan.outputs.apps }}
      DRAFT: ${{ needs.plan.outputs.draft }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Pin new app releases
        id: pin
        run: |
          mapfile -t tags < <(python3 -c 'import json, os; print("\n".join(json.loads(os.environ["APPS"])))')
          if [ "$DRAFT" != true ] || [ ${#tags[@]} -eq 0 ] || [ -z "${tags[0]}" ]; then
            echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q origin main
          head=$(git rev-parse origin/main)
          if [ "$head" != "$COMMIT" ]; then
            if [ "$(git rev-parse "$head^")" = "$COMMIT" ] && git log -1 --format=%s "$head" | grep -q '^Pin '; then
              echo "Pinned already in $head"
              echo "commit=$head" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved on from the release commit $COMMIT to $head: nothing is pinned or tagged." >&2
            echo "Start the release again from the Nexus Release Tool on the new main." >&2
            exit 1
          fi
          for tag in "${tags[@]}"; do
            gh release download "$tag" --pattern SHA256SUMS --dir "sums/$tag"
          done
          python3 bazzite-console/tools/suite_release.py pin sums "${tags[@]}"
          rm -rf sums
          python3 bazzite-console/tools/check_manifest.py --require-tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bazzite-console/portal/apps.toml
          git commit -q -m "Pin ${tags[*]}"
          git push origin "HEAD:refs/heads/main"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  portal:
    needs: [plan, pin]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.portal != '' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.portal }}
      COMMIT: ${{ needs.pin.outputs.commit }}
      DRAFT: ${{ needs.plan.outputs.draft }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Checks and portal requirements
        run: |
          python tools/check_versions.py --suite bazzite-console
          python bazzite-console/tools/check_manifest.py --require-tags
          python -m pip install -q -r bazzite-console/portal/requirements.txt
      - name: Bundled Bazzite Test
        run: |
          bt=$(python -c 'import tomllib; print(tomllib.load(open("bazzite-console/portal/apps.toml", "rb"))["apps"]["bazzite"]["tag"])')
          mkdir -p bundle
          gh release download "$bt" --pattern "$bt.tar.gz" --pattern SHA256SUMS --dir bundle
      - name: Build
        run: |
          python tools/build_release.py "$TAG" dist --bundle bundle
          cat dist/SHA256SUMS
      - name: Publish
        run: |
          args=()
          [ "$DRAFT" = true ] && args+=(--draft)
          bash bazzite-console/tools/publish_release.sh "$TAG" "$COMMIT" dist "${args[@]}"
