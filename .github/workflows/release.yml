# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

# One GitHub release per tag. Tags are made by hand, one per app: <app>-v<x.y.z> (check-v0.1.0,
# gpu-v0.4.0, ...) or portal-v<x.y.z>. The tag's version must equal that app's VERSION file.
#
# The assets are <tag>.tar.gz, SHA256SUMS and the notes, all built by tools/build_release.py, so a local build
# has the same content (see docs/portal.md, "Checking a release"). A portal release bundles the release of Bazzite Test (check) that bc250-bazzite/portal/apps.toml pins (downloaded
# from its own release and checked against the pin) and requires every pinned tag to exist.
#
# Console Link ships the wheel of its native core in the tarball (native/wheel, build_release.py checks it is
# there): built here from the tag, with FFmpeg from its pinned sources (native/ffmpeg/build.sh), so installing
# needs only pip.
#
# An app that ships a Windows executable (tools/build_windows_exe.py, WINDOWS_APPS) gets a second job on its tag:
# it builds the .exe on Windows and adds <app-id>-<version>-windows.zip and its .sha256 to the release the first job
# made. They are separate downloads; the portal and SHA256SUMS only know the tarball.
#
# After an app release: python3 bc250-bazzite/tools/pin_app.py <tag>, bump bc250-bazzite/portal/VERSION as bc250-bazzite/tools/check_manifest.py asks, and
# tag the portal when the combination is tested.
#
# Only a commit that CI passed becomes a release: the first job waits for every CI run on the tagged commit (the
# push to main; a tag starts no CI of its own), up to 75 minutes, and stops everything when one did not pass.
# tools/tag-release.sh asks the same before it tags.
#
# The release job runs in no environment, so GitHub asks no approval before it builds and publishes (owner,
# 23-10-2026: approving every tag took too long when one change to core makes many app releases).

on:
  push:
    tags: ["*-v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 80                 # ci_state waits up to 75
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_state.py --wait 75 "$GITHUB_SHA"

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # tags, for check_manifest and the reproducible mtime

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Checks
        run: |
          python tools/check_versions.py
          case "$TAG" in
            portal-v*) python bc250-bazzite/tools/check_manifest.py --require-tags ;;
            *)         python bc250-bazzite/tools/check_manifest.py ;;
          esac

      - name: Bundled Bazzite Test (portal releases)
        if: startsWith(github.ref_name, 'portal-v')
        run: |
          bt=$(python -c 'import tomllib; print(tomllib.load(open("bc250-bazzite/portal/apps.toml", "rb"))["apps"]["check"]["tag"])')
          mkdir -p bundle
          gh release download "$bt" --pattern "$bt.tar.gz" --pattern SHA256SUMS --dir bundle

      - name: Native wheel (consoles releases)
        if: startsWith(github.ref_name, 'consoles-v')
        working-directory: bc250-bazzite/apps/consoles/native
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nasm libva-dev
          ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg"
          python -m pip install -q "maturin>=1.5,<2"
          BC250_FFMPEG_DIR="$RUNNER_TEMP/ffmpeg" maturin build --release --locked --compatibility linux \
            --features python,pyo3/extension-module,decoder -o wheel

      - name: Build
        run: |
          args=()
          [ -d bundle ] && args+=(--bundle bundle)
          python tools/build_release.py "$TAG" dist "${args[@]}"
          cat dist/SHA256SUMS

      - name: Publish
        run: |
          app=${TAG%-v*}
          title="$app ${TAG##*-v}"
          # Only a portal release is GitHub's "Latest": /releases/latest is what users install, never an app.
          latest=false
          [ "$app" = portal ] && latest=true
          # GitHub's API now and then answers one request with a 500 (26-10-2026: one of 32 releases published
          # in the same minute). Up to five tries, a growing pause between them. When a try made the release but
          # its answer was lost (or a re-run finds the release of an earlier run), the next adds the assets to it.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "dist/$TAG.tar.gz" dist/SHA256SUMS --clobber && exit 0
            elif gh release create "$TAG" "dist/$TAG.tar.gz" dist/SHA256SUMS \
                   --title "$title" --notes-file dist/notes.md --verify-tag --latest="$latest"; then
              exit 0
            fi
            [ "$attempt" = 5 ] && break
            echo "Publishing failed (try $attempt of 5); again in $((attempt * 30)) s" >&2
            sleep $((attempt * 30))
          done
          echo "Publishing $TAG failed five times." >&2
          exit 1

  windows:
    # sftp; add the tag of every app in WINDOWS_APPS (tools/tests/test_build_windows_exe.py checks it is here)
    if: startsWith(github.ref_name, 'sftp-v')
    needs: release
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -q -r bc250-bazzite/apps/sftp/requirements.txt pyinstaller pillow

      - name: Build the executable
        run: python tools/build_windows_exe.py sftp windist

      - name: Add it to the release
        shell: bash
        run: gh release upload "$TAG" windist/*.zip windist/*.zip.sha256 --clobber
