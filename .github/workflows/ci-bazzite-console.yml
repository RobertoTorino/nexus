# SPDX-License-Identifier: GPL-3.0-or-later
name: CI Bazzite Console

on:
  push:
    branches: ["**"]
    paths:
      - "bazzite-console/**"
      - "core/**"
      - "tools/**"
      - "dev/**"
      - "test.sh"
      - "requirements-dev.txt"
      - ".github/workflows/ci-bazzite-console.yml"
      - ".github/workflows/release-bazzite-console.yml"
  pull_request:
    paths:
      - "bazzite-console/**"
      - "core/**"
      - "tools/**"
      - "dev/**"
      - "test.sh"
      - "requirements-dev.txt"
      - ".github/workflows/ci-bazzite-console.yml"
      - ".github/workflows/release-bazzite-console.yml"

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Versions
        run: python tools/check_versions.py --suite bazzite-console
      - name: Portal manifest
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python bazzite-console/tools/check_manifest.py ${BASE:+--base "$BASE"}

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.plan.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
      - name: Test folders
        id: plan
        run: python3 tools/ci_matrix.py --suite bazzite-console pytest | tee -a "$GITHUB_OUTPUT"

  pytest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.plan.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements-dev.txt"
      - name: Qt runtime libraries
        timeout-minutes: 5
        working-directory: .
        run: bash tools/ci-qt-libs.sh --pulse
      - name: Install
        run: python -m pip install -q -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: find bazzite-console tools test.sh -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Shellcheck
        run: |
          shellcheck -x -S error bazzite-console/install.sh bazzite-console/portal/install.sh \
            bazzite-console/apps/*/install.sh bazzite-console/tools/*.sh \
            bazzite-console/tools/installer-tests/*.sh
          shellcheck -x -S warning bazzite-console/tools/check-release.sh \
            bazzite-console/portal/install.sh bazzite-console/apps/bazzite/install.sh \
            bazzite-console/tools/installer-tests/*.sh

  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: fakeroot
        run: sudo apt-get install -y -q fakeroot
      - name: Installer tests
        run: |
          failed=()
          run() { echo "::group::${1##*/}"; bash "$1" || { echo "::error file=$1::${1##*/} failed"; failed+=("${1##*/}"); }; echo "::endgroup::"; }
          for t in bazzite-console/tools/installer-tests/*.sh; do
            [ "${t##*/}" = shims.sh ] || run "$t"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "Failed: ${failed[*]}" >&2; exit 1; }

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2" "pillow>=12,<13"
      - name: Qt runtime libraries
        timeout-minutes: 5
        run: bash tools/ci-qt-libs.sh
      - run: mkdocs build --strict -f bazzite-console/mkdocs.yml
